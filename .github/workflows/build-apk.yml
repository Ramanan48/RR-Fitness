name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK (ANDROID_HOME); no setup-android step needed.
      - name: Show Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (timer engine)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: RamananFit-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
